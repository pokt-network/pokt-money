name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  HARBOR_IMAGE: registry.infra.pocket.network/pnf/pokt-money

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pull requests (including from forks) only build; pushes to main and manual runs also publish.
      PUSH: ${{ github.event_name != 'pull_request' }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor
        # Optional: only when HARBOR_USERNAME / HARBOR_PASSWORD are configured as repository secrets.
        if: env.PUSH == 'true' && env.HARBOR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: registry.infra.pocket.network
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HARBOR_IMAGE }},enable=${{ env.HARBOR_USERNAME != '' }}
          tags: |
            # sha-<short sha>, same scheme as the `docker:build` script in package.json
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
